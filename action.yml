name: iam-legend
description: AI code review for GCP IAM gaps before terraform apply.
inputs:
  terraform-plan:
    description: Path to terraform plan JSON output (optional; falls back to static HCL scan).
    required: false
  working-directory:
    description: Repo root or subdirectory to scan.
    required: false
    default: '.'
  project-id:
    description: GCP project the deploy targets.
    required: true
  github-token:
    description: GitHub token used to post the PR review. Default uses the workflow's GITHUB_TOKEN.
    required: false
    default: ${{ github.token }}
  vertex-project:
    description: GCP project hosting the Vertex AI Gemini calls. Defaults to project-id. Required for the Gemini-written review prose path; if absent, iam-legend falls back to templated prose.
    required: false
    default: ''
  vertex-location:
    description: Vertex AI region for Gemini calls.
    required: false
    default: 'us-central1'
  vertex-model:
    description: Gemini model identifier (e.g. gemini-flash-latest, gemini-pro-latest).
    required: false
    default: 'gemini-flash-latest'
runs:
  using: docker
  image: Dockerfile
  env:
    IAM_LEGEND_MODE: action
    INPUT_TERRAFORM_PLAN: ${{ inputs.terraform-plan }}
    INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
    INPUT_PROJECT_ID: ${{ inputs.project-id }}
    # Docker-based actions don't automatically inherit GITHUB_TOKEN; forward
    # it explicitly so the CLI's PR-posting code can authenticate.
    GITHUB_TOKEN: ${{ inputs.github-token }}
    # Vertex Gemini configuration. Without these set, the recommender +
    # reviewer fall back to templated prose. The action's runtime SA needs
    # roles/aiplatform.user on $VERTEX_PROJECT.
    VERTEX_PROJECT: ${{ inputs.vertex-project }}
    VERTEX_LOCATION: ${{ inputs.vertex-location }}
    VERTEX_MODEL: ${{ inputs.vertex-model }}
